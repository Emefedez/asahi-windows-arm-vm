# tuned-ppd: power-profiles-daemon API (powerprofilesctl, Omarchy battery widget/menu) -> TuneD profiles.
# Apple Silicon has no ACPI platform_profile, so power-profiles-daemon only offered power-saver/balanced.
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=false

[profiles]
# PPD = TuneD
power-saver=asahi-power-saver
balanced=asahi-balanced
performance=asahi-performance

[battery]
# PPD = TuneD
balanced=asahi-balanced
